name: prefferance

services:
  db:
    image: postgres:17-alpine
    container_name: prefferance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefferance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefferance}
      POSTGRES_DB: ${POSTGRES_DB:-prefferance}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefferance} -d ${POSTGRES_DB:-prefferance}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: